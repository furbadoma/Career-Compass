        * {

        }

        body {

        }

        .container {

        .header {
            text-align: center;

        }

        }

        }

        .header p {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
        }

        .progress {
            background: white;
            padding: 15px 20px;
            border-radius: 14px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .progress-bar {
            height: 8px;
            background: #e8ebf0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #222;
            transition: width 0.3s ease;
        }

        .day {
            background: white;
            border-radius: 16px;
            margin-bottom: 14px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .day-header {
            width: 100%;
            padding: 20px;
            border: none;
            background: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            font-size: 17px;
            font-weight: bold;
        }

        .day-header:hover {
            background: #f8f8f8;
        }

        .arrow {
            font-size: 20px;
            margin-left: 10px;
        }

        .day-content {
            display: none;
            padding: 0 22px 24px;
        }

        .day-content.open {
            display: block;
        }

        .activity {
            background: #f5f7fb;
            border-radius: 12px;
            padding: 18px;
            margin: 10px 0 18px;
        }

        .activity h3 {
            margin-top: 0;
        }

        .activity p {
            line-height: 1.6;
        }

        .tip {
            border-left: 4px solid #555;
            padding-left: 12px;
            margin: 15px 0;
            color: #555;
            line-height: 1.5;
        }

        .helper {
            background: white;
            border: 1px solid #e3e6eb;
            border-radius: 12px;
            padding: 16px;
            margin: 18px 0;
        }

        .helper-label {
            font-size: 13px;
            font-weight: bold;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 7px;
        }

        .helper h4 {
            margin: 5px 0 8px;
            font-size: 17px;
        }

        .helper p {
            color: #555;
            margin-bottom: 14px;
        }

        .resource-btn {
            display: inline-block;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 9px;
            background: #222;
            color: white;
            font-size: 14px;
        }

        .resource-btn:hover {
            opacity: 0.85;
        }

        .complete-btn {
            padding: 11px 18px;
            border: none;
            border-radius: 9px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .complete-btn.completed {
            background: #4caf50;
        }

        .final-section {
            display: none;
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-top: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);

        </p>

    <button class="back-btn" onclick="history.back()">

</div>

function getDirection() {

    const params = new URLSearchParams(window.location.search);

    return params.get("direction");

}


function getStorageKey(direction) {

    return "challenge-progress-" + direction;

}


function getCompletedDays(direction) {

    const saved =
        localStorage.getItem(getStorageKey(direction));

    return saved ? JSON.parse(saved) : [];

}


function saveCompletedDays(direction, completedDays) {

    localStorage.setItem(
        getStorageKey(direction),
        JSON.stringify(completedDays)
    );

}


function createChallenge() {

    const direction = getDirection();

    const challenge = challenges[direction];

    if (!challenge) {

        document.getElementById("challengeContainer").innerHTML = `
            <div class="error">
                <h2>Challenge not found</h2>
                <p>Please return to your quiz results and start the challenge again.</p>
            </div>
        `;

        return;
    }

    document.getElementById("directionEmoji").textContent =
        challenge.emoji;

    document.getElementById("challengeTitle").textContent =
        direction + ": 7-Day Challenge";

    document.getElementById("challengeDescription").textContent =
        challenge.description;

    const container =
        document.getElementById("challengeContainer");

    const completedDays =
        getCompletedDays(direction);

    challenge.days.forEach((day, index) => {

        const dayNumber = index + 1;

        const dayElement =
            document.createElement("div");

        dayElement.className = "day";

        let helperHTML = "";

        if (day.helper) {

            helperHTML = `
                <div class="helper">

                    <div class="helper-label">
                        ${day.helper.type}
                    </div>

                    <h4>
                        ${day.helper.title}
                    </h4>

                    <p>
                        ${day.helper.text}
                    </p>

                    <a
                        class="resource-btn"
                        href="${day.helper.url}"
                        target="_blank"
                        rel="noopener noreferrer">

                        Open Resource →

                    </a>

                </div>
            `;

        }

        const isCompleted =
            completedDays.includes(dayNumber);

        dayElement.innerHTML = `

            <button
                class="day-header"
                onclick="toggleDay(this)">

                <span>
                    Day ${dayNumber} — ${day.title}
                </span>

                <span class="arrow">
                    +
                </span>

            </button>

            <div class="day-content">

                <div class="activity">

                    <h3>
                        🎯 Your Activity
                    </h3>

                    <p>
                        ${day.activity}
                    </p>

                    ${
                        day.tip
                        ? `
                            <div class="tip">
                                💡 <strong>Tip:</strong>
                                ${day.tip}
                            </div>
                          `
                        : ""
                    }

                    ${helperHTML}

                    <button
                        class="complete-btn ${isCompleted ? "completed" : ""}"
                        onclick="completeDay(this, ${dayNumber})">

                        ${
                            isCompleted
                            ? "✓ Completed"
                            : "Mark as complete"
                        }

                    </button>

                </div>

            </div>
        `;

        container.appendChild(dayElement);

    });

    updateProgress();
    checkFeedback();

}


function toggleDay(button) {

    const content =
        button.nextElementSibling;

    const arrow =
        button.querySelector(".arrow");

    content.classList.toggle("open");

    if (content.classList.contains("open")) {

        arrow.textContent = "−";

    } else {

        arrow.textContent = "+";

    }

}


function completeDay(button, dayNumber) {

    const direction =
        getDirection();

    let completedDays =
        getCompletedDays(direction);

    if (completedDays.includes(dayNumber)) {

        completedDays =
            completedDays.filter(
                day => day !== dayNumber
            );

        button.classList.remove("completed");

        button.textContent =
            "Mark as complete";

    } else {

        completedDays.push(dayNumber);

        completedDays.sort(
            (a, b) => a - b
        );

        button.classList.add("completed");

        button.textContent =
            "✓ Completed";

    }

    saveCompletedDays(
        direction,
        completedDays
    );

    updateProgress();
    checkFeedback();

}


function updateProgress() {

    const direction =
        getDirection();

    const completed =
        getCompletedDays(direction).length;

    document.getElementById("progressText").textContent =
        completed + " of 7 days completed";

    const percentage =
        (completed / 7) * 100;

    document.getElementById("progressFill").style.width =
        percentage + "%";

}


function checkFeedback() {

    const direction =
        getDirection();

    const completed =
        getCompletedDays(direction).length;

    const feedbackSection =
        document.getElementById("feedbackSection");

    if (completed === 7) {

        feedbackSection.classList.add("show");

    } else {

        feedbackSection.classList.remove("show");

    }

}


let selectedRating = 0;


function setRating(number) {

    selectedRating = number;

    const stars =
        document.querySelectorAll(".star");

    stars.forEach((star, index) => {

        if (index < number) {

            star.classList.add("selected");

        } else {

            star.classList.remove("selected");

        }

    });

}


function submitFeedback() {

    const direction =
        getDirection();

    const feedback = {

        direction: direction,

        enjoyed:
            document.getElementById("enjoyed").value,

        difficult:
            document.getElementById("difficult").value,

        learned:
            document.getElementById("learned").value,

        favoriteDay:
            document.getElementById("favoriteDay").value,

        rating:
            selectedRating,

        improve:
            document.getElementById("improve").value

    };

    localStorage.setItem(
        "challenge-feedback-" + direction,
        JSON.stringify(feedback)
    );

    document.getElementById("feedbackSuccess").style.display =
        "block";

}


createChallenge();

</script>
